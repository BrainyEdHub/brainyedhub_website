<style>

  #backBtn{width:clamp(44px,4vw,50px);height:clamp(44px,4vw,50px);border-radius:50%;background:rgba(148,163,184,.1);border:1px solid rgba(148,163,184,.22);color:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;pointer-events:auto;transition:all .2s ease;padding:0;flex:none;margin-top:4px}

  #restartBtn{width:clamp(44px,4vw,50px);height:clamp(44px,4vw,50px);border-radius:50%;background:rgba(148,163,184,.1);border:1px solid rgba(148,163,184,.22);color:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;pointer-events:auto;transition:all .2s ease;padding:0;flex:none;margin-top:4px}

  #packChip{position:fixed;bottom:clamp(14px,2.4vw,22px);left:clamp(16px,2.8vw,30px);padding:7px 14px 7px 12px;background:rgba(15,23,42,.62);border:1px solid rgba(148,163,184,.14);border-radius:99px;font-size:10.5px;font-weight:700;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;opacity:0;transition:opacity .4s;pointer-events:none;z-index:15;display:flex;align-items:center;gap:8px}

  #packChip .chip-emoji{font-size:13px;letter-spacing:0}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse 80% 60% at 50% 42%,rgba(27,58,92,.55),transparent 70%),radial-gradient(ellipse 50% 40% at 50% 100%,rgba(249,115,22,.1),transparent 70%),rgba(4,8,18,.94);z-index:20;transition:opacity .45s ease;overflow-y:auto}
  #overlay.hidden{opacity:0;pointer-events:none}
  #overlay.hidden *{pointer-events:none !important}

  .opt.locked{opacity:.42;cursor:not-allowed;filter:grayscale(.55)}

  .opt.locked::after{content:'🔒';position:absolute;top:4px;right:6px;font-size:10px;line-height:1;opacity:.9}

  @keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .opt.nudge{animation:nudge .32s ease}
  button.primary{position:relative;margin-top:22px;padding:14px 52px;font-family:inherit;font-size:clamp(13px,1.6vw,15px);font-weight:800;letter-spacing:.22em;color:#FFF;border:none;border-radius:100px;cursor:pointer;overflow:hidden;background:linear-gradient(115deg,var(--orange) 0%,var(--orange-soft) 32%,var(--blue-soft) 68%,var(--blue) 100%);background-size:200% 100%;box-shadow:0 14px 40px rgba(249,115,22,.42),0 8px 28px rgba(59,130,246,.34),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .25s,background-position .5s;text-shadow:0 1px 4px rgba(0,0,0,.35);text-transform:uppercase;pointer-events:auto}
  button.primary::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(120deg,transparent 0%,rgba(255,255,255,.5) 50%,transparent 100%);transition:left .7s ease}

  button.primary:hover::before{left:100%}
  button.primary:active{transform:translateY(-1px) scale(1)}
  button.secondary{padding:13px 40px;font-family:inherit;font-size:clamp(12px,1.5vw,14px);font-weight:800;letter-spacing:.2em;color:#FFF;border:1px solid rgba(249,115,22,.55);border-radius:100px;cursor:pointer;background:rgba(249,115,22,.12);transition:transform .2s cubic-bezier(.34,1.56,.64,1),background .2s,border-color .2s,box-shadow .2s;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.3)}
  button.secondary:hover{background:rgba(249,115,22,.24);border-color:var(--orange);transform:translateY(-2px);box-shadow:0 8px 24px rgba(249,115,22,.35)}
  button.secondary:active{transform:translateY(0)}
  button.ghost{padding:11px 32px;font-family:inherit;font-size:clamp(11px,1.4vw,13px);font-weight:700;letter-spacing:.2em;color:var(--muted);border:1px solid rgba(148,163,184,.22);border-radius:100px;cursor:pointer;background:transparent;transition:all .2s ease;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  button.ghost:hover{color:#F1F5F9;border-color:rgba(148,163,184,.45);background:rgba(148,163,184,.08);transform:translateY(-2px)}
  button.ghost:active{transform:translateY(0)}
  button.ghost svg{width:14px;height:14px}
  button.danger{padding:13px 40px;font-family:inherit;font-size:clamp(12px,1.5vw,14px);font-weight:800;letter-spacing:.2em;color:#FFF;border:1px solid rgba(239,68,68,.55);border-radius:100px;cursor:pointer;background:rgba(239,68,68,.14);transition:all .2s ease;text-transform:uppercase}

  .win-actions{display:flex;flex-direction:column;align-items:center;gap:9px;margin-top:22px}

  .star-icon.earned:nth-child(3){animation-delay:.55s}

  .pop{position:fixed;font-weight:900;font-size:clamp(22px,3.2vw,34px);letter-spacing:-.03em;pointer-events:none;z-index:15;transform:translate(-50%,-50%);animation:popUp 1s cubic-bezier(.2,.7,.3,1) forwards;text-shadow:0 0 24px currentColor,0 2px 8px rgba(0,0,0,.5);white-space:nowrap}
  @keyframes popUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-82%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-230%) scale(1)}}
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(0);padding:13px 26px;background:rgba(15,23,42,.96);border:1px solid rgba(249,115,22,.5);border-radius:99px;color:#FFF;font-size:13px;font-weight:700;letter-spacing:.06em;box-shadow:0 12px 36px rgba(0,0,0,.6),0 0 28px rgba(249,115,22,.3);z-index:100;opacity:1;transition:opacity .35s ease,transform .35s ease;pointer-events:none;display:flex;align-items:center;gap:10px;white-space:nowrap;max-width:calc(100vw - 40px)}
  .toast.hide{opacity:0;transform:translateX(-50%) translateY(12px)}
  .toast .tick{color:#7DFFBF;font-weight:900;font-size:15px}
  @media(max-width:620px){

    .opt small{font-size:7px}
    .selector-row.auto-fit{grid-template-columns:repeat(auto-fit,minmax(82px,1fr))}
    .stat{min-width:64px}
    .stat .v{font-size:clamp(18px,2.8vw,26px)}
    .hud-left{gap:8px}
    .hud-right{gap:10px}
    #backBtn,#restartBtn{width:42px;height:42px;margin-top:2px}
  }
</style>
</head>

function drawShapeIcon(ctx, shape, cx, cy, size) {
  const r = size / 2;
  const ORANGE = '#F97316';
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = ORANGE;
  ctx.strokeStyle = ORANGE;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  switch (shape) {
    case 'triangle':
      ctx.beginPath();
      ctx.moveTo(0, -r);
      ctx.lineTo(r * Math.sqrt(3) / 2, r * 0.5);
      ctx.lineTo(-r * Math.sqrt(3) / 2, r * 0.5);
      ctx.closePath(); ctx.fill(); break;
    case 'circle':
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); break;
    case 'square':
      ctx.fillRect(-r * 0.88, -r * 0.88, r * 1.76, r * 1.76); break;
    case 'diamond':
      ctx.beginPath();
      ctx.moveTo(0, -r); ctx.lineTo(r * 0.88, 0);
      ctx.lineTo(0, r); ctx.lineTo(-r * 0.88, 0);
      ctx.closePath(); ctx.fill(); break;
    case 'star': {
      ctx.beginPath();
      const outer = r, inner = r * 0.44;
      for (let i = 0; i < 10; i++) {
        const rad = (i % 2 === 0) ? outer : inner;
        const a = -Math.PI / 2 + (i * Math.PI / 5);
        const x = Math.cos(a) * rad, y = Math.sin(a) * rad;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath(); ctx.fill(); break;
    }
    case 'heart': {
      const s = r * 1.05;
      ctx.beginPath();
      ctx.moveTo(0, s * 0.72);
      ctx.bezierCurveTo(-s * 1.15, -s * 0.15, -s * 0.65, -s * 1.05, 0, -s * 0.4);
      ctx.bezierCurveTo(s * 0.65, -s * 1.05, s * 1.15, -s * 0.15, 0, s * 0.72);
      ctx.closePath(); ctx.fill(); break;
    }
    case 'ring':
      ctx.beginPath(); ctx.arc(0, 0, r * 0.82, 0, Math.PI * 2);
      ctx.lineWidth = size * 0.17; ctx.stroke(); break;
    case 'cross':
      ctx.beginPath();
      ctx.moveTo(-r * 0.7, -r * 0.7); ctx.lineTo(r * 0.7, r * 0.7);
      ctx.moveTo(r * 0.7, -r * 0.7); ctx.lineTo(-r * 0.7, r * 0.7);
      ctx.lineWidth = size * 0.17; ctx.stroke(); break;
    case 'arrow':
      ctx.beginPath();
      ctx.moveTo(-r * 0.75, 0); ctx.lineTo(r * 0.65, 0);
      ctx.moveTo(r * 0.25, -r * 0.5); ctx.lineTo(r * 0.72, 0);
      ctx.lineTo(r * 0.25, r * 0.5);
      ctx.lineWidth = size * 0.16; ctx.stroke(); break;
    case 'octagon':
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = Math.PI / 8 + i * Math.PI / 4;
        const x = Math.cos(a) * r, y = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath(); ctx.fill(); break;
    case 'plus':
      ctx.beginPath();
      ctx.moveTo(-r * 0.75, 0); ctx.lineTo(r * 0.75, 0);
      ctx.moveTo(0, -r * 0.75); ctx.lineTo(0, r * 0.75);
      ctx.lineWidth = size * 0.20; ctx.stroke(); break;
    case 'minus':
      ctx.beginPath();
      ctx.moveTo(-r * 0.8, 0); ctx.lineTo(r * 0.8, 0);
      ctx.lineWidth = size * 0.20; ctx.stroke(); break;
  }
  ctx.restore();
}

function buildFaceTex(content){
  const c=document.createElement('canvas'); c.width=TW; c.height=TH;
  const ctx=c.getContext('2d');
  const g=ctx.createLinearGradient(0,0,0,TH);
  g.addColorStop(0,'#FFFFFF'); g.addColorStop(1,'#EAF1FA');
  ctx.fillStyle=g; roundRect(ctx,0,0,TW,TH,28); ctx.fill();
  ctx.lineWidth=7; ctx.strokeStyle='#F97316'; ctx.shadowColor='rgba(249,115,22,0.55)'; ctx.shadowBlur=14;
  roundRect(ctx,10,10,TW-20,TH-20,22); ctx.stroke(); ctx.shadowBlur=0;
  ctx.lineWidth=1.5; ctx.strokeStyle='rgba(27,58,92,0.35)';
  roundRect(ctx,22,22,TW-44,TH-44,16); ctx.stroke();

  ctx.textAlign='center'; ctx.textBaseline='middle';

  if (content.startsWith('@shape:')) {
    drawShapeIcon(ctx, content.slice(7), TW/2, TH/2, 165);
  } else if (VISUAL_RE.test(content)){
    let size=200; const maxW=TW-70;
    ctx.font=`${size}px ${EMOJI_FONT}`;
    while (ctx.measureText(content).width>maxW && size>26){ size-=5; ctx.font=`${size}px ${EMOJI_FONT}`; }
    ctx.fillText(content,TW/2,TH/2+size*0.06);
  } else {
    const maxW = TW * 0.82;
    const maxH = TH * 0.62;
    let size = 150;
    ctx.font = `900 ${size}px "Inter",system-ui,sans-serif`;
    while (ctx.measureText(content).width > maxW && size > 28) {
      size -= 4;
      ctx.font = `900 ${size}px "Inter",system-ui,sans-serif`;
    }
    if (size > maxH) size = maxH;

    ctx.fillStyle='#1B3A5C';
    ctx.fillText(content,TW/2,TH/2+6);

    const w = ctx.measureText(content).width;
    const uw = Math.min(w * 0.65, 130);
    const uy = TH/2 + size/2 + 14;
    const ug = ctx.createLinearGradient(TW/2-uw/2,0,TW/2+uw/2,0);
    ug.addColorStop(0,'transparent'); ug.addColorStop(0.5,'rgba(249,115,22,0.85)'); ug.addColorStop(1,'transparent');
    ctx.fillStyle=ug; ctx.fillRect(TW/2-uw/2,uy,uw,3);
  }

  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
function getFaceTex(content){
  let tex=faceCache.get(content);
  if (!tex){ tex=buildFaceTex(content); faceCache.set(content,tex); }

}

}

function isPackAllowed(key){

function getAllowedPackKeys(){ return Object.keys(PACKS).filter(k=>isPackAllowed(k)); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function getNextPackKey(){

function createCard(faceTexture){

  const faceMat = new THREE.MeshBasicMaterial({map:faceTexture,transparent:true,toneMapped:false});

function clearCards(){
  for (const c of state.cards){
    cardGroup.remove(c.group);
    c.edgeMat.dispose(); c.coverMat.dispose(); c.faceMat.dispose();
  }
  state.cards=[]; state.hitMeshes=[];
}

function getPairPool(n){
  let candidates;
  if (state.pack === 'mix') {
    const allowed = getAllowedPackKeys();
    candidates = [];
    allowed.forEach(k => { if (PACKS[k].pairs) candidates.push(...PACKS[k].pairs); });
  } else {
    candidates = PACKS[state.pack].pairs.slice();
  }
  const shuffled = shuffle(candidates);
  const usedContent = new Set();
  const unique = [];
  for (const [a, b] of shuffled) {
    if (usedContent.has(a) || usedContent.has(b)) continue;
    usedContent.add(a);
    usedContent.add(b);
    unique.push([a, b]);
    if (unique.length >= n) break;
  }
  return unique;
}

function buildRound(){
  clearCards();
  state.roundToken++;
  state.hovered = null;

  const diff = DIFFICULTY[state.difficulty];
  const pairPool = getPairPool(diff.pairs);
  const cardCount = pairPool.length * 2;
  const cols = diff.cols;
  const rows = Math.max(1, Math.ceil(cardCount / cols));

  const specs = [];
  pairPool.forEach(([a,b],idx)=>{ specs.push({content:a,pairId:idx}); specs.push({content:b,pairId:idx}); });
  const shuffled = shuffle(specs);
  const stepX = CW + GAP, stepY = CH + GAP;
  const totalW = cols*CW + (cols-1)*GAP;
  const totalH = rows*CH + (rows-1)*GAP;

  shuffled.forEach((spec,i)=>{
    const r = Math.floor(i/cols), c = i % cols;
    const x = -totalW/2 + CW/2 + c*stepX;
    const y =  totalH/2 - CH/2 - r*stepY;
    const tex = getFaceTex(spec.content);
    const card = createCard(tex);
    card.pairId = spec.pairId;
    card.baseY = y;
    card.entryT = -(i*0.035);
    card.group.position.set(x,y,0);
    card.group.rotation.y = 0;
    card.group.scale.setScalar(0.001);
    cardGroup.add(card.group);
    state.cards.push(card);
    state.hitMeshes.push(card.hit);
  });

  state.flipped=[]; state.matchedPairs=0; state.totalPairs=pairPool.length;
  state.moves=0; state.elapsed=0; state.resolveTimer=0; state.phase='playing';

  fitCamera(totalW, totalH);
  el.pairsFound.textContent = `0 / ${pairPool.length}`;
  el.moves.textContent = '0';
  lastTimerSec = -1;
  updateTimer(); updatePackChip();
  sfxFlip();
}

  document.getElementById('packChipText').textContent = `${p.label} · ${d.label}`;

function fitCamera(gw, gh){
  const vh = window.innerHeight;
  const vw = window.innerWidth;
  const hudTopPx = vw < 620 ? 150 : 185;
  const hudBottomPx = 75;
  const availableVh = Math.max(vh * 0.45, vh - hudTopPx - hudBottomPx);

  const vFov = THREE.MathUtils.degToRad(camera.fov);
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);

  const visibleHeightNeeded = gh * (vh / availableVh);
  const distV = visibleHeightNeeded / (2 * Math.tan(vFov / 2));
  const distH = (gw / 0.9) / (2 * Math.tan(hFov / 2));
  const dist = Math.max(distV, distH);

  const visibleHeight = 2 * Math.tan(vFov / 2) * dist;
  const offsetPx = (hudTopPx - hudBottomPx) / 2;
  const offsetWorld = (offsetPx / vh) * visibleHeight;
  cardGroup.position.y = -offsetWorld;

  camera.position.set(0, dist * 0.05, dist);
  camera.lookAt(0, 0, 0);
  camera.userData.baseZ = dist;
}

function popText(x,y,text,color){
  const d=document.createElement('div'); d.className='pop'; d.textContent=text;
  d.style.left=x+'px'; d.style.top=y+'px'; d.style.color=color;
  document.body.appendChild(d); d.addEventListener('animationend',()=>d.remove());
}
function showToast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span class="tick">✓</span><span>${msg}</span>`;
  document.body.appendChild(t);
  setTimeout(() => {
    t.classList.add('hide');
    setTimeout(() => t.remove(), 400);
  }, 2000);
}
function startFlip(card,faceUp){ card.rotFrom=card.rotCurrent; card.rotTo=faceUp?Math.PI:0; card.flipT=0; }
function toScreen(x,y,z){
  const v=new THREE.Vector3(x,y,z); v.project(camera);
  return {x:(v.x*0.5+0.5)*window.innerWidth, y:(-v.y*0.5+0.5)*window.innerHeight};
}

function onClick(){
  const now = performance.now();
  if (now - state.lastClick < 120) return;
  if (state.phase !== 'playing') return;
  if (state.flipped.length >= 2) return;

  const targets = [];
  for (const c of state.cards) if (c.state === 'down') targets.push(c.hit);
  if (!targets.length) return;

  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(targets, false);
  if (!hits.length) return;

  const card = state.cards.find(c => c.hit === hits[0].object);
  if (!card) return;

  state.lastClick = now;
  card.state = 'up';
  startFlip(card, true);
  state.flipped.push(card);
  sfxFlip();

  if (state.flipped.length === 2){
    state.moves++; el.moves.textContent = state.moves;
    state.phase = 'resolving'; state.resolveTimer = 0;
    const [a,b] = state.flipped;
    if (a.pairId === b.pairId){
      state.matchedPairs++;
      el.pairsFound.textContent = `${state.matchedPairs} / ${state.totalPairs}`;
      a.state='matched'; b.state='matched'; a.matchedT=0; b.matchedT=0;
      const wpA = new THREE.Vector3(); a.group.getWorldPosition(wpA);
      const wpB = new THREE.Vector3(); b.group.getWorldPosition(wpB);
      sfxMatch();
      const midX=(wpA.x+wpB.x)/2, midY=(wpA.y+wpB.y)/2+1.2;
      const scr = toScreen(midX, midY, 0);
      popText(scr.x, scr.y, 'MATCH!', '#FFC48A');
      state.resolveTimer = -0.25;
    } else sfxMiss();
  }
}

function resolveMatch(){
  state.flipped=[]; state.resolveTimer=0; state.phase='playing';
  if (state.matchedPairs === state.totalPairs) {
    const token = state.roundToken;
    setTimeout(() => {
      if (state.roundToken === token) winGame();
    }, 300);
  }
}
function resolveMiss(){
  const [a,b] = state.flipped;
  if (a){ a.state='down'; startFlip(a,false); }
  if (b){ b.state='down'; startFlip(b,false); }
  state.flipped=[]; state.resolveTimer=0; state.phase='playing';
}

async function shareProgress(){
  initAudio();
  sfxShare();

  const pack = PACKS[state.pack];
  const diff = DIFFICULTY[state.difficulty];
  const total = Math.floor(state.elapsed);
  const m = Math.floor(total / 60);
  const s = total % 60;
  const timeStr = `${m}:${s.toString().padStart(2, '0')}`;
  const starsStr = '★'.repeat(state.lastStars) + '☆'.repeat(3 - state.lastStars);

  const shareText =
    `🎮 I just finished a BrainyEdHub Memory Match round!\n\n` +
    `${pack.icon} ${pack.label} · ${diff.label}\n` +
    `${starsStr}\n` +
    `⏱ Time: ${timeStr}\n` +
    `🔄 Moves: ${state.moves}\n` +
    `✅ Pairs: ${state.totalPairs}\n\n` +
    `Can you beat my score? Try it on BrainyEdHub!`;

  const isFile = window.location.protocol === 'file:';
  const shareData = { title: 'BrainyEdHub Memory Match 3D', text: shareText };
  if (!isFile) shareData.url = window.location.href;

  if (navigator.share) {
    try {
      await navigator.share(shareData);
      showToast('Shared successfully');
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;
    }
  }

  const copyText = shareText + (isFile ? '' : '\n' + window.location.href);
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(copyText);
      showToast('Copied to clipboard');
      return;
    }
  } catch (err) {}

  try {
    const ta = document.createElement('textarea');
    ta.value = copyText;
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    showToast('Copied to clipboard');
  } catch (err) {
    showToast('Could not share on this device');
  }
}

function winGame(){
  state.phase = 'won';
  sfxWin();
  const diff = DIFFICULTY[state.difficulty];
  let stars = 1;
  if (state.moves <= diff.star3) stars = 3;
  else if (state.moves <= diff.star2) stars = 2;
  state.lastStars = stars;

  const total = Math.floor(state.elapsed);
  const m = Math.floor(total/60), s = total%60;
  const timeStr = `${m}:${s.toString().padStart(2,'0')}`;
  const heading = stars===3?'Perfect Memory!':stars===2?'Great Job!':'Well Done!';
  const subtitle = stars===3?'Flawless recall — brilliant!':stars===2?'Sharp work, nearly perfect.':'You found them all!';
  const pack = PACKS[state.pack];
  const nextKey = getNextPackKey();
  const nextPack = PACKS[nextKey];
  const isSameNext = (nextKey === state.pack);

  setTimeout(()=>{
    showPanel(`
      ${WORDMARK_HTML}
      <h1>${heading}<span>${subtitle}</span></h1>
      <div class="stars-row">
        <span class="star-icon ${stars>=1?'earned':''}">★</span>
        <span class="star-icon ${stars>=2?'earned':''}">★</span>
        <span class="star-icon ${stars>=3?'earned':''}">★</span>
      </div>
      <div class="stats-grid">
        <div><span class="k">Time</span><span class="v">${timeStr}</span></div>
        <div><span class="k">Moves</span><span class="v">${state.moves}</span></div>
        <div><span class="k">Topic</span><span class="v" style="font-size:16px">${pack.icon} ${pack.label}</span></div>
      </div>
      <div class="win-actions">
        <button class="primary" id="playBtn">Play Again</button>
        ${!isSameNext ? `<button class="secondary" id="nextBtn">Next: ${nextPack.icon} ${nextPack.label} →</button>` : ''}
        <button class="ghost" id="shareBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
            <path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>
          </svg>
          Share Result
        </button>
        <button class="ghost" id="menuBtn">Main Menu</button>
      </div>
      <div class="hint">Press Enter to play · Esc for menu</div>
    `);
    document.getElementById('playBtn').addEventListener('click', ()=>{
      initAudio(); hidePanel(); buildRound();
    });
    const nextBtn = document.getElementById('nextBtn');
    if (nextBtn) nextBtn.addEventListener('click', ()=>{
      initAudio(); state.pack = nextKey; hidePanel(); buildRound();
    });
    document.getElementById('shareBtn').addEventListener('click', shareProgress);
    document.getElementById('menuBtn').addEventListener('click', ()=>{
      initAudio(); hidePanel(); el.hud.classList.remove('on'); showStart();
    });
  }, 900);
}

function confirmExit(){
  state.pausedFrom = (state.phase === 'playing' || state.phase === 'resolving') ? state.phase : 'playing';
  state.phase = 'paused';
  const pack = PACKS[state.pack];
  const diff = DIFFICULTY[state.difficulty];

  showPanel(`
    ${WORDMARK_HTML}
    <h1>Exit<span>Game?</span></h1>
    <p>You're currently playing <strong style="color:#FFA35C">${pack.icon} ${pack.label} · ${diff.label}</strong>. If you exit now, this round's progress will be lost.</p>
    <div class="win-actions">
      <button class="primary" id="resumeBtn">Keep Playing</button>
      <button class="danger" id="confirmExitBtn">Exit to Menu</button>
    </div>
    <div class="hint">Press Esc to resume</div>
  `);
  document.getElementById('resumeBtn').addEventListener('click', ()=>{
    initAudio(); hidePanel();
    state.phase = state.pausedFrom || 'playing';
    state.pausedFrom = null;
  });
  document.getElementById('confirmExitBtn').addEventListener('click', ()=>{
    initAudio(); sfxBack(); hidePanel(); state.pausedFrom = null;
    el.hud.classList.remove('on'); showStart();
  });
}

function showPanel(html){ el.panel.innerHTML=html; el.overlay.classList.remove('hidden'); }
function hidePanel(){ el.overlay.classList.add('hidden'); }

function buildPackButtons(){
  return Object.entries(PACKS).map(([key,p])=>{
    const allowed = isPackAllowed(key);
    const subText = allowed ? p.sub : `Ages ${p.ages[0]}–${p.ages[1]}`;
    const classes = ['opt'];
    if (p.isMix) classes.push('mix');
    if (key===state.pack && allowed) classes.push('active');
    if (!allowed) classes.push('locked');
    return `<button class="${classes.join(' ')}" data-pack="${key}" ${allowed?'':'data-locked="1"'}>
      <span class="opt-emoji">${p.icon}</span>${p.label}<small>${subText}</small></button>`;
  }).join('');
}

function attachMenuHandlers(){
  document.querySelectorAll('[data-age]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      initAudio();
      state.ageGroup = btn.dataset.age;
      document.querySelectorAll('[data-age]').forEach(b=>b.classList.toggle('active',b.dataset.age===state.ageGroup));
      if (!isPackAllowed(state.pack)) state.pack='mix';
      const grid = document.querySelector('[data-pack-grid]');
      if (grid) grid.innerHTML = buildPackButtons();
      attachPackHandlers();
    });
  });
  document.querySelectorAll('[data-diff]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      initAudio();
      state.difficulty = btn.dataset.diff;
      document.querySelectorAll('[data-diff]').forEach(b=>b.classList.toggle('active',b.dataset.diff===state.difficulty));
    });
  });
  const playBtn = document.getElementById('playBtn');
  if (playBtn) playBtn.addEventListener('click',()=>{ initAudio(); hidePanel(); el.hud.classList.add('on'); buildRound(); });
}

function attachPackHandlers(){
  document.querySelectorAll('[data-pack]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      initAudio();
      const key = btn.dataset.pack;
      if (btn.classList.contains('locked') || btn.dataset.locked){
        btn.classList.remove('nudge'); void btn.offsetWidth; btn.classList.add('nudge');
        sfxLocked(); return;
      }
      state.pack = key;
      document.querySelectorAll('[data-pack]').forEach(b=>b.classList.toggle('active',b.dataset.pack===state.pack));
    });
  });
}

function showStart(){
  state.phase = 'menu';
  clearCards();
  cardGroup.position.y = 0;
  document.getElementById('packChip').classList.remove('on');

  const ageHTML = Object.entries(AGE_GROUPS).map(([key,g])=>
    `<button class="opt ${key===state.ageGroup?'active':''}" data-age="${key}">${g.label}</button>`).join('');
  const diffHTML = Object.entries(DIFFICULTY).map(([key,d])=>
    `<button class="opt ${key===state.difficulty?'active':''}" data-diff="${key}">${d.label}<small>${d.sub}</small></button>`).join('');

  showPanel(`
    ${WORDMARK_HTML}
    <h1>Memory<span>Match 3D</span></h1>
    <p>Flip the cards and find every matching pair. Pick an age group, difficulty and topic — or choose <strong style="color:#FFA35C">Mix</strong> to blend all subjects.</p>
    <div class="selector"><span class="selector-label">Age Group</span><div class="selector-row cols-4">${ageHTML}</div></div>
    <div class="selector"><span class="selector-label">Difficulty</span><div class="selector-row cols-3">${diffHTML}</div></div>
    <div class="selector"><span class="selector-label">Learning Pack</span><div class="selector-row auto-fit" data-pack-grid>${buildPackButtons()}</div></div>
    <button class="primary" id="playBtn">Play</button>
    <div class="hint">Click a card to flip it</div>
  `);
  attachMenuHandlers();
  attachPackHandlers();
}

function setPointerFromXY(x, y){
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((x - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((y - rect.top) / rect.height) * 2 + 1;
}

let downX = 0, downY = 0, downTime = 0, downValid = false;
canvas.addEventListener('pointerdown', (e) => {
  initAudio();
  if (e.button !== undefined && e.button !== 0) return;
  downX = e.clientX; downY = e.clientY;
  downTime = performance.now();
  downValid = true;
});
canvas.addEventListener('pointerup', (e) => {
  if (!downValid) return;
  downValid = false;
  if (e.button !== undefined && e.button !== 0) return;
  const dt = performance.now() - downTime;
  if (dt > 700) return;
  const dx = e.clientX - downX, dy = e.clientY - downY;
  if (dx*dx + dy*dy > 225) return;
  setPointerFromXY(e.clientX, e.clientY);
  onClick();
});
canvas.addEventListener('pointercancel', () => { downValid = false; });

let lastHoverCheck = 0;
canvas.addEventListener('pointermove', (e) => {
  const now = performance.now();
  if (now - lastHoverCheck < 70) return;
  lastHoverCheck = now;
  setPointerFromXY(e.clientX, e.clientY);
  if (state.phase !== 'playing'){ state.hovered = null; canvas.style.cursor = 'default'; return; }
  raycaster.setFromCamera(pointer, camera);
  const targets = [];
  for (const c of state.cards) if (c.state === 'down') targets.push(c.hit);
  const hits = raycaster.intersectObjects(targets, false);
  const card = hits.length ? state.cards.find(c => c.hit === hits[0].object) : null;
  state.hovered = card || null;
  canvas.style.cursor = card ? 'pointer' : 'default';
});
canvas.addEventListener('pointerleave', () => { state.hovered = null; canvas.style.cursor = 'default'; });

window.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && (state.phase === 'menu' || state.phase === 'won')){
    const btn = document.getElementById('playBtn');
    if (btn){ e.preventDefault(); initAudio(); hidePanel(); el.hud.classList.add('on'); buildRound(); }
  }
  if (e.key === 'Escape' && state.phase === 'won'){
    initAudio(); hidePanel(); el.hud.classList.remove('on'); showStart();
  }
  if (e.key === 'Escape' && (state.phase === 'playing' || state.phase === 'resolving')){
    e.preventDefault();
    confirmExit();
  }
  if (e.key === 'Escape' && state.phase === 'paused'){
    e.preventDefault();
    const resumeBtn = document.getElementById('resumeBtn');
    if (resumeBtn) resumeBtn.click();
  }
});

el.restartBtn.addEventListener('click', () => {
  initAudio();
  if (state.phase === 'playing' || state.phase === 'resolving') buildRound();
});
el.backBtn.addEventListener('click', () => {
  initAudio();
  if (state.phase === 'playing' || state.phase === 'resolving') confirmExit();
});

function easeInOutCubic(x){ return x<0.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2; }
function easeOutBack(x){ const c1=1.70158, c3=c1+1; return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); }

function updateCards(dt, time){
  for (let i=0;i<state.cards.length;i++){
    const card = state.cards[i];
    const g = card.group;
    if (card.entryT < 1){
      card.entryT += dt / ENTRY_DUR;
      if (card.entryT < 0) g.scale.setScalar(0.001);
      else if (card.entryT < 1) g.scale.setScalar(easeOutBack(card.entryT));
      else g.scale.setScalar(1);
    }
    if (card.flipT < 1){
      card.flipT = Math.min(1, card.flipT + dt / FLIP_DUR);
      const e = easeInOutCubic(card.flipT);
      card.rotCurrent = card.rotFrom + (card.rotTo - card.rotFrom) * e;
      g.rotation.y = card.rotCurrent;
      g.position.z = Math.sin(card.flipT * Math.PI) * 0.22;
    } else {
      const hovered = state.hovered === card && card.state === 'down';
      const targetZ = hovered ? 0.12 : 0;
      g.position.z += (targetZ - g.position.z) * Math.min(dt * 12, 1);
      const targetS = hovered ? 1.06 : 1;
      const cur = g.scale.x;
      if (Math.abs(cur - targetS) > 0.001) g.scale.setScalar(cur + (targetS - cur) * Math.min(dt * 12, 1));
    }
    g.position.y = card.baseY + Math.sin(time * 1.4 + card.floatPhase) * 0.055;
    if (card.state === 'matched'){
      card.matchedT += dt;
      const fade = Math.max(0, 1 - card.matchedT * 0.75);
      const op = 0.30 + fade * 0.70;
      card.coverMat.opacity = op;
      card.faceMat.opacity = op;
      card.edgeMat.opacity = op;
    }
  }
}

let lastTime = performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  const time = now / 1000;

  const stars = window.__stars;
  if (stars){ stars.rotation.y += dt*0.006; stars.rotation.x += dt*0.002; }

  for (let i=0;i<nebulas.length;i++){
    const n = nebulas[i];
    n.sprite.position.y = n.baseY + Math.sin(time*0.18 + n.phase)*1.6;
    n.sprite.material.opacity = 0.14 + Math.sin(time*0.4 + n.phase)*0.05;
  }
  rimOrange.position.x = Math.sin(time*0.4)*16;
  rimBlue.position.x = Math.cos(time*0.35)*16;

  if (state.phase === 'playing'){ state.elapsed += dt; updateTimer(); }

  if (state.phase === 'resolving'){
    state.resolveTimer += dt;
    const a = state.flipped[0], b = state.flipped[1];
    if (a && b && a.state === 'matched' && b.state === 'matched'){
      if (state.resolveTimer >= 0.55) resolveMatch();
    } else if (state.resolveTimer >= RESOLVE_WAIT){
      resolveMiss();
    }
  }

  updateCards(dt, time);

  const baseZ = camera.userData.baseZ || 10;
  camera.position.x = Math.sin(time*0.22)*0.25;
  camera.position.y = baseZ*0.05 + Math.cos(time*0.30)*0.18;
  camera.position.z = baseZ;
  camera.lookAt(0,0,0);

  renderer.render(scene, camera);
}

function onResize(){
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  if (state.cards.length){
    const diff = DIFFICULTY[state.difficulty];
    const cardCount = state.cards.length;
    const rows = Math.max(1, Math.ceil(cardCount / diff.cols));
    const totalW = diff.cols*CW + (diff.cols-1)*GAP;
    const totalH = rows*CH + (rows-1)*GAP;
    fitCamera(totalW, totalH);
  }
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 150));

showStart();
requestAnimationFrame(animate);
</script>
