// All lengths are counted in 24ths of a whole, so every fraction stays exact.
const U=0.5,COL={2:'#F2701C',3:'#2E9BD6',4:'#8E5CD6',6:'#2EB872',8:'#D9A400',12:'#E0457B'};
const gcd=(a,b)=>b?gcd(b,a%b):a,lcm=(a,b)=>a*b/gcd(a,b);
const frac=u=>{if(!u)return'0';const g=gcd(u,24),n=u/g,d=24/g;return d===1?'1 whole':n+'/'+d};
const $=id=>document.getElementById(id);
const P=s=>{const[n,d]=s.split('/').map(Number);return{n,d,u:24*n/d,lab:s}};
const F=(t,g,gap,pl,tip)=>({type:'fill',t,g,gap:P(gap).u,pl:pl.map(P),tip});
const Mt=(t,g,rs,tip)=>({type:'match',t,g,rounds:rs.map(([a,o])=>({tgt:P(a),pl:o.map(P)})),tip});
const TIERS={
 easy:{name:'Easy',sub:'Grades 3-4',lives:5,lv:[
  F('Build a whole','Fractions with the same bottom number are easy to add. 1/4 + 1/4 + 1/2 = 1 whole.','1/1',['1/2','1/4'],'Two 1/4 planks are exactly as long as one 1/2 plank.'),
  F('Quarters only','Only quarters measure quarters. A plank with a different bottom number, like 1/3, will not fit.','3/4',['1/4','2/4','1/3'],'3/4 = 1/4 + 1/4 + 1/4, or 1/4 + 2/4. Thirds never fit into quarters.'),
  Mt('Same length, different name','Equivalent fractions have different names but the same length. Find the plank equal to the gap.',[['1/2',['2/4','1/4','3/4','1/3']],['1/3',['2/6','1/6','1/2','2/3']],['3/4',['6/8','1/2','2/3','4/8']]],'1/2 = 2/4, 1/3 = 2/6 and 3/4 = 6/8. Multiply the top and bottom by the same number!'),
  F('Thirds and sixths','Thirds and sixths fit together because 1/3 = 2/6. Quarters do not belong here.','1/1',['1/3','1/6','1/4'],'1 whole = 1/3 + 1/3 + 1/3, and every 1/3 is the same as 2/6.'),
  Mt('Equal fractions again','Find the plank that matches the gap. Wrong ones are shorter or longer.',[['2/3',['4/6','3/6','2/6','4/4']],['1/2',['4/8','3/8','5/8','1/4']],['3/4',['9/12','6/12','3/12','8/12']]],'4/6 = 2/3, 4/8 = 1/2 and 9/12 = 3/4.'),
  F('Eighths make a whole','The top number counts the pieces. Eight 1/8 pieces make 1 whole, and bigger pieces work too.','1/1',['1/8','2/8','4/8'],'1 whole = 8/8 = 4/8 + 4/8.'),
  Mt('Halves in disguise','Many fractions are secretly 1/2: the top number is half of the bottom number.',[['1/2',['3/6','2/6','4/6','3/8']],['1/2',['6/12','5/12','7/12','2/3']],['1/2',['4/8','3/8','5/8','1/3']]],'3/6, 6/12 and 4/8 are all 1/2. The top is half of the bottom.'),
  F('Add the tops','With the same bottom number, just add the top numbers: 1/6 + 2/6 = 3/6.','5/6',['1/6','2/6','3/6'],'5/6 = 1/6 + 2/6 + 2/6, or 2/6 + 3/6. Add the tops, keep the bottom.'),
  Mt('Smaller pieces','Cutting each piece in half doubles the pieces but keeps the same length.',[['1/4',['2/8','1/8','3/8','2/4']],['1/6',['2/12','1/12','3/12','1/3']],['1/2',['4/8','3/8','1/4','2/3']]],'1/4 = 2/8, 1/6 = 2/12 and 1/2 = 4/8.'),
  F('Boss level: Easy','Use everything you learned. Same bottom numbers add, and equal fractions can swap.','1/1',['1/2','2/4','1/4','1/3'],'1 whole = 1/2 + 2/4, or 1/3 + 1/3 + 1/3. Thirds only fit with thirds.')]},
 med:{name:'Medium',sub:'Grades 4-5',lives:4,lv:[
  F('Halves, thirds, quarters','Fractions with different bottom numbers do not always fit together. Plan ahead so no gap is left over.','1/1',['1/2','1/3','1/4'],'1/2 + 1/3 = 5/6 leaves 1/6, a hole no plank can fill. Thirds go with thirds!'),
  F('Three-quarters','Try different mixes to make 3/4 exactly.','3/4',['1/3','1/4','1/6'],'3/4 = 1/4 + 1/4 + 1/4, and also 1/3 + 1/6 + 1/4.'),

  F('Eighths','Eighths fit with halves because 1/2 = 4/8. Thirds do not fit with eighths.','1/1',['1/2','1/3','1/8'],'1 whole = 1/2 + 4/8, or 8/8. Different bottom numbers need a shared size.'),
  Mt('Simplest form','The gap is not in its simplest form. Divide the top and bottom by the same number to find the match.',[['6/8',['3/4','2/3','1/2','5/6']],['4/12',['1/3','1/4','1/2','2/3']],['8/12',['2/3','3/4','1/3','5/6']]],'6/8 = 3/4, 4/12 = 1/3 and 8/12 = 2/3.'),

  F('Seven-twelfths','Which mix of planks makes 7/12 exactly?','7/12',['1/4','1/3','1/6','1/2'],'7/12 = 1/4 + 1/3. A half leaves 1/12, and nothing is that small.'),
  Mt('More than one match','Sometimes two planks are both correct. Pick any one that matches.',[['3/4',['6/8','9/12','2/3','5/6']],['1/3',['4/12','2/6','1/4','2/3']],['2/3',['8/12','4/6','1/2','3/4']]],'6/8 = 9/12 = 3/4. A fraction has many names.'),
  F('Boss level: Medium','Make 5/8 with halves, quarters, eighths and thirds. One of them is a trap.','5/8',['1/2','1/4','1/8','1/3'],'5/8 = 1/2 + 1/8, or 1/4 + 1/4 + 1/8. Thirds do not fit with eighths.')]},
 hard:{name:'Hard',sub:'Grades 5-6',lives:3,lv:[
  F('Seven-eighths','Use halves, quarters and eighths. A third will not fit anywhere.','7/8',['1/2','1/4','1/8','1/3'],'7/8 = 1/2 + 1/4 + 1/8. Thirds never fit into eighths.'),
  Mt('Spot the equal fraction','Bigger bottom numbers are harder. Find the plank equal to the gap.',[['3/4',['9/12','5/6','2/3','7/8']],['5/6',['10/12','3/4','7/8','4/6']],['7/12',['14/24','7/8','1/2','8/12']]],'9/12 = 3/4, 10/12 = 5/6 and 14/24 = 7/12.'),
  F('More than a whole','Fractions can be bigger than 1 whole. 5/4 means 1 whole and 1/4 more.','5/4',['3/4','1/2','1/3','1/6'],'5/4 = 3/4 + 1/2, and also 3/4 + 1/3 + 1/6.'),
  F('Eleven-twelfths','Which mix of planks makes 11/12 exactly?','11/12',['1/2','1/3','1/4'],'11/12 = 1/3 + 1/3 + 1/4. Only one mix works!'),
  F('Mixed pieces','Combine three-quarters, thirds and eighths to make 1 whole.','1/1',['3/4','1/3','1/8'],'1 whole = 3/4 + 1/8 + 1/8, or 1/3 + 1/3 + 1/3.'),
  Mt('Big bottom numbers','Twenty-fourths are tiny pieces. Find the plank equal to the gap.',[['5/12',['10/24','5/6','3/8','1/2']],['3/8',['9/24','1/3','1/2','5/12']],['7/8',['21/24','5/6','3/4','11/12']]],'10/24 = 5/12, 9/24 = 3/8 and 21/24 = 7/8.'),
  F('Nine-eighths','9/8 is more than a whole: 1 whole and 1/8 more.','9/8',['1/2','3/4','1/8','1/3'],'9/8 = 3/4 + 1/8 + 1/8 + 1/8, or 1/2 + 1/2 + 1/8.'),
  F('Thirteen-twelfths','Make more than a whole with halves, thirds, quarters and sixths.','13/12',['1/2','1/3','1/4','1/6'],'13/12 = 1/2 + 1/3 + 1/4. Twelfths are the shared size.'),
  Mt('Mixed numbers','Fractions bigger than 1 can have many names. Find a plank equal to the gap.',[['5/4',['10/8','9/8','7/6','4/3']],['3/2',['9/6','6/4','5/4','8/6']],['4/3',['8/6','5/4','3/2','7/6']]],'5/4 = 10/8, 3/2 = 9/6 = 6/4 and 4/3 = 8/6.'),
  F('Boss level: Hard','Final challenge! Make 17/12, which is 1 whole and 5/12 more.','17/12',['1/2','1/3','1/4','3/4'],'17/12 = 3/4 + 1/3 + 1/3, or 1/2 + 1/3 + 1/3 + 1/4.')]}

function eq(a,b){const l=lcm(a.d,b.d);return a.lab+' = '+a.n*l/a.d+'/'+l+' and '+b.lab+' = '+b.n*l/b.d+'/'+l}
let AC=null,AOUT=null,SA=null,mute=false;try{mute=localStorage.getItem('beMute')==='1'}catch(e){}
function ac(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();AOUT=AC.createGain();AOUT.gain.value=.8;const cp=AC.createDynamicsCompressor();cp.threshold.value=-12;cp.knee.value=0;cp.ratio.value=20;cp.attack.value=.002;cp.release.value=.1;AOUT.connect(cp);cp.connect(AC.destination)}catch(e){AC=null}
   try{navigator.audioSession.type='playback'}catch(e){}
   try{SA=new Audio('data:audio/wav;base64,UklGRmQGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YUAGAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAg const SFX={
 place(t){tone(420,t,.12,'triangle',.7,160);tone(190,t,.18,'sine',.6,70);hiss(t,.08,'bandpass',1400,1.2,.6);hiss(t,.12,'lowpass',700,.7,.5)},

  cloth.rotation.y=Math.sin(t*3)*.25;
  planks.forEach(x=>{if(x.m.position.y>-.15)x.m.position.y=Math.max(-.15,x.m.position.y-8*dt)});
  crash.forEach(c=>{c.age+=dt;if(c.age<.6){c.m.position.y=Math.max(-.15,c.m.position.y-8*dt);c.m.position.x=c.x+Math.sin(c.age*50)*.06}else{c.m.position.y-=6*dt;c.m.rotation.z+=3*dt}if(c.m.position.y<-2.5){scene.remove(c.m);c.dead=1}});crash=crash.filter(c=>!c.dead);
  bits.forEach(b=>{b.age+=dt;b.vy-=9*dt;b.m.position.x+=b.vx*dt;b.m.position.y+=b.vy*dt;b.m.position.z+=b.vz*dt;b.m.rotation.x+=5*dt;if(b.age>1.8){scene.remove(b.m);b.dead=1}});bits=bits.filter(b=>!b.dead);
  let face=0;
  if(st==='cross'||st==='toedge'){
    face=Math.PI/2;hero.position.x+=2.6*dt;pose('walk',t);const sg=Math.sin(t*8)>0;if(sg!==lastSg){lastSg=sg;sfx('step')}
    if(hero.position.x>=tgtX){if(st==='cross')win();else{st='fall';vy=0}}
  }else if(st==='fall'){
    face=Math.PI/2;vy-=14*dt;hero.position.y+=vy*dt;hero.position.x+=.6*dt;inner.rotation.x+=3*dt;pose('fall',t);
    if(hero.position.y<-1.8){st='lost';lose()}
  }else if(st==='won'){hero.position.y=Math.abs(Math.sin(t*5))*.35;pose('cheer',t)}
  else if(st!=='lost')pose('idle',t);
  hero.rotation.y+=(face-hero.rotation.y)*Math.min(1,dt*8);
  cam.position.set(Math.sin(th)*D,2.5+D*.22,Math.cos(th)*D);cam.lookAt(0,-.4,0);
  R.render(scene,cam);
}
let chIdx=0,pendMenu=true;
function showPick(){
  $('pn').textContent='Hi '+name+'! Pick how you look.';const g=$('pg');g.innerHTML='';
  CH.forEach((c,i)=>{const b=document.createElement('button');b.className='cb'+(i===chIdx?' on':'');b.setAttribute('aria-label','Character '+(i+1));
   b.innerHTML='<svg viewBox="0 0 60 72" width="52" height="62"><rect x="12" y="46" width="36" height="24" rx="9" fill="'+c.sh+'" stroke="#0A1A33" stroke-width="2.5"/><circle cx="30" cy="31" r="16" fill="'+c.s+'" stroke="#0A1A33" stroke-width="2.5"/><path d="M13 27A17 15 0 0 1 47 27Z" fill="'+c.h+'" stroke="#0A1A33" stroke-width="2.5"/><rect x="9" y="26" width="42" height="5" rx="2.5" fill="'+c.h+'" stroke="#0A1A33" stroke-width="2.5"/><circle cx="24" cy="36" r="2.6" fill="#111"/><circle cx="36" cy="36" r="2.6" fill="#111"/><path d="M23 42Q30 49 37 42" stroke="#7A1F1F" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>';
   b.onclick=()=>{chIdx=i;look(i);sfx('click');[...g.children].forEach((x,j)=>x.classList.toggle('on',j===i))};g.appendChild(b)});
  $('pick').classList.remove('hide')}
$('pgo').onclick=()=>{try{localStorage.setItem(pk(name,'beChar'),chIdx)}catch(e){}$('pick').classList.add('hide');sfx('ding');if(pendMenu)menu();else say('Welcome back, '+name+'!')};
function begin(n){
  n=(n||$('nm').value||'').trim().slice(0,12)||'Sam';const same=name===n;
  setName(n);loadP(n);try{const p=profiles().filter(x=>x.toLowerCase()!==n.toLowerCase());p.unshift(n);localStorage.setItem('beProfiles',JSON.stringify(p.slice(0,8)))}catch(e){}
  $('intro').classList.add('hide');sfx('click');chIdx=0;try{chIdx=+localStorage.getItem(pk(n,'beChar'))||0}catch(e){}look(chIdx);pendMenu=!same;showPick()}
function showIntro(){const d=$('pl');d.innerHTML='';profiles().forEach(n=>{const b=document.createElement('button');b.className='b dif';b.textContent=n;b.onclick=()=>begin(n);d.appendChild(b)});$('nm').value='';$('intro').classList.remove('hide')}
$('st').onclick=()=>begin();$('nm').onkeydown=e=>{if(e.key==='Enter')begin()};$('rn').onclick=showIntro;
$('hint').onclick=()=>{
  if(st!=='build'||busy())return;
  const rem=GAP-used,ok=cur.filter(p=>L.type==='fill'?(rem-p.u>=0&&can(rem-p.u)):p.u===GAP);
  if(!ok.length){say('No plank can finish the bridge from here. Try Undo.');return}
  const p=ok[0];hints++;sfx('hint');
  document.querySelectorAll('.pk').forEach(b=>b.classList.toggle('glow',b.getAttribute('data-l')===p.lab));
  setTimeout(()=>document.querySelectorAll('.pk').forEach(b=>b.classList.remove('glow')),3500);
  say('Hint: try the '+p.lab+' plank. Hints cost a star, so you can still earn '+Math.max(1,3-hints)+'.')};
$('barb').onclick=()=>{barOn=!barOn;try{localStorage.setItem('beBar',barOn?'1':'0')}catch(e){}$('barb').setAttribute('aria-pressed',barOn);drawBar()};
$('snd').onclick=()=>{mute=!mute;try{localStorage.setItem('beMute',mute?'1':'0')}catch(e){}$('snd').textContent=mute?'Sound off':'Sound on';sfx('ding')};
$('snd').textContent=mute?'Sound off':'Sound on';$('barb').setAttribute('aria-pressed',barOn);
$('cx').onclick=()=>$('cert').classList.add('hide');
addEventListener('pointerdown',()=>{if(!mute)ac()},true);
showIntro();load(0,true);requestAnimationFrame(loop);
</script>
